<!doctype html>
<html lang="en" data-theme="classic-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SET</title>
    <meta name="description" content="Play the card game SET." />
    <meta name="theme-color" content="#1f1f23" />
    <meta name="color-scheme" content="dark light" />

    <!-- Home-screen app on iPhone (Share → Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SET" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

    <link rel="preload" href="fonts/notable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      try {
        const theme = JSON.parse(localStorage.getItem('setpremium:settings'))?.theme;
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SET needs JavaScript to run.</noscript>
  </body>
</html>
